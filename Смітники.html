<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Смітники</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1a1c20;--mut:#6b7280;--ac:#16a34a;--bd:#e5e7eb;--dg:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111316;--card:#1c1f24;--tx:#f1f2f4;--mut:#9aa1ad;--bd:#2b2f36}}
:root[data-theme="dark"]{--bg:#111316;--card:#1c1f24;--tx:#f1f2f4;--mut:#9aa1ad;--bd:#2b2f36}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;padding:16px;max-width:560px;margin:0 auto}
h1{font-size:20px;margin:4px 0 12px}
.gps{font-size:13px;color:var(--mut);margin-bottom:12px}
#add{width:100%;padding:22px;font-size:20px;font-weight:700;border:0;border-radius:16px;background:var(--ac);color:#fff}
#add:active{opacity:.8}
input,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px;margin-top:10px;font-family:inherit}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-top:10px;display:flex;gap:10px;align-items:center}
.card.near{border-color:var(--ac);border-width:2px}
.info{flex:1;min-width:0}
.d{font-weight:700;font-size:17px}
.n{font-size:13px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
a.go,button.x{padding:10px 12px;border-radius:10px;font-size:14px;text-decoration:none;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
a.go{background:var(--ac);color:#fff;border:0;font-weight:600}
button.x{color:var(--dg)}
h2{font-size:15px;margin:22px 0 4px;color:var(--mut)}
.row{display:flex;gap:8px;margin-top:8px}
.row button{flex:1;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:14px}
#msg{min-height:18px;font-size:13px;margin-top:8px;color:var(--ac)}
</style>
</head>
<body>
<h1>🗑️ Смітники</h1>
<div class="gps" id="gps">Шукаю GPS…</div>
<button id="add">📍 Смітник тут</button>
<input id="note" placeholder="Нотатка (необов’язково): за рогом, біля арки…">
<div id="msg"></div>
<h2 id="cnt"></h2>
<div id="list"></div>
<h2>Резервна копія</h2>
<div class="row"><button id="exp">Скопіювати дані</button><button id="imp">Вставити дані</button></div>
<textarea id="box" rows="3" placeholder="Сюди вставляй скопійовані дані, потім натисни «Вставити дані»" style="display:none"></textarea>
<script>
var bins=[],pos=null,KEY="bins_v1";
function load(){try{bins=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){bins=[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(bins))}catch(e){msg("Не вдалось зберегти. Скопіюй дані вручну.")}}
function msg(t){document.getElementById("msg").textContent=t}
function dist(a,b,c,d){var R=6371000,r=Math.PI/180,x=(c-a)*r,y=(d-b)*r,h=Math.sin(x/2)*Math.sin(x/2)+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)*Math.sin(y/2);return 2*R*Math.asin(Math.sqrt(h))}
function fmt(m){return m<1000?Math.round(m)+" м":(m/1000).toFixed(1)+" км"}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function render(){
  var l=document.getElementById("list"),items=bins.map(function(b){return{b:b,d:pos?dist(pos.lat,pos.lng,b.lat,b.lng):null}});
  if(pos)items.sort(function(x,y){return x.d-y.d});else items.reverse();
  document.getElementById("cnt").textContent="Збережено: "+bins.length+(pos?" · найближчі зверху":"");
  l.innerHTML=items.slice(0,40).map(function(it,i){var b=it.b;
    return '<div class="card'+(i===0&&pos?' near':'')+'"><div class="info"><div class="d">'+(it.d===null?'—':fmt(it.d))+'</div><div class="n">'+esc(b.note||"без нотатки")+'</div></div>'+
    '<a class="go" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination='+b.lat+','+b.lng+'">Маршрут</a>'+
    '<button class="x" data-id="'+b.id+'">✕</button></div>'}).join("");
}
document.getElementById("list").onclick=function(e){var id=e.target.getAttribute&&e.target.getAttribute("data-id");if(!id)return;
  bins=bins.filter(function(b){return String(b.id)!==id});save();render()};
document.getElementById("add").onclick=function(){
  if(!pos){msg("Ще нема GPS. Дозволь доступ до геолокації.");return}
  var n=document.getElementById("note");
  bins.push({id:Date.now(),lat:pos.lat,lng:pos.lng,acc:Math.round(pos.acc),note:n.value.trim(),t:new Date().toISOString()});
  n.value="";save();render();msg("✓ Збережено (точність ±"+Math.round(pos.acc)+" м)");
  if(navigator.vibrate)navigator.vibrate(60)};
document.getElementById("exp").onclick=function(){var t=JSON.stringify(bins);
  if(navigator.clipboard){navigator.clipboard.writeText(t).then(function(){msg("Скопійовано. Встав у нотатки як резерв.")},function(){showBox(t)})}else showBox(t)};
function showBox(t){var b=document.getElementById("box");b.style.display="block";b.value=t;b.select();msg("Скопіюй текст вручну")}
document.getElementById("imp").onclick=function(){var b=document.getElementById("box");
  if(b.style.display==="none"){b.style.display="block";b.value="";return}
  try{var a=JSON.parse(b.value),have={};bins.forEach(function(x){have[x.id]=1});
    a.forEach(function(x){if(x&&x.lat&&x.lng&&!have[x.id])bins.push(x)});save();render();b.style.display="none";msg("Імпортовано")}catch(e){msg("Не схоже на дані")}};
function watch(){
  if(!navigator.geolocation){document.getElementById("gps").textContent="Геолокація недоступна";return}
  navigator.geolocation.watchPosition(function(p){pos={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy};
    document.getElementById("gps").textContent="GPS: ±"+Math.round(pos.acc)+" м";render()},
  function(){document.getElementById("gps").textContent="GPS не дозволено. Увімкни геолокацію для браузера."},
  {enableHighAccuracy:true,maximumAge:3000,timeout:20000})}
load();render();watch();
</script>
</body>
</html>
