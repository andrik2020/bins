<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Вивіз сміття</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1a1c20;--mut:#6b7280;--ac:#16a34a;--bd:#e5e7eb;--dg:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111316;--card:#1c1f24;--tx:#f1f2f4;--mut:#9aa1ad;--bd:#2b2f36}}
:root[data-theme="dark"]{--bg:#111316;--card:#1c1f24;--tx:#f1f2f4;--mut:#9aa1ad;--bd:#2b2f36}
*{box-sizing:border-box}
body{margin:0 auto;background:var(--bg);color:var(--tx);font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;padding:14px;max-width:560px}
.gps{font-size:12px;color:var(--mut);margin:0 0 8px}
#near{position:sticky;top:6px;z-index:2000;box-shadow:0 2px 8px rgba(0,0,0,.25);background:var(--ac);color:#fff;border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;margin-bottom:10px}
#near .t{flex:1;font-size:15px}#near b{font-size:20px;display:block}
#near a.sm{display:block;background:none;color:#fff;font-weight:400;font-size:13px;padding:2px 0 0;text-decoration:underline;margin-top:2px}
.big{padding:16px}.bigaddr{font-size:24px;font-weight:800;line-height:1.2}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.chip{background:var(--tx);color:var(--bg);padding:8px 12px;border-radius:10px;font-size:22px;font-weight:800}.chip.code{background:var(--ac);color:#fff}.bn{font-size:16px;color:var(--tx)}
#near a{background:#fff;color:#15803d;font-weight:700;padding:10px 14px;border-radius:10px;text-decoration:none}
.tabs{display:flex;gap:8px;margin-bottom:10px}
.tabs button{flex:1;padding:12px 4px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:13px;font-weight:600}.dim{opacity:.5}
.tabs button.on{background:var(--tx);color:var(--bg)}
#add,#cadd{width:100%;padding:20px;font-size:19px;font-weight:700;border:0;border-radius:16px;background:var(--ac);color:#fff}
#cadd{margin-top:8px}
input,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px;margin-top:8px;font-family:inherit}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-top:10px}
.row{display:flex;gap:8px;align-items:center}
.card.near{border-color:var(--ac);border-width:2px}
.info{flex:1;min-width:0}
.d{font-weight:700;font-size:17px}
.n{font-size:14px;color:var(--mut);margin-top:3px;white-space:pre-wrap}
.btn{padding:10px 12px;border-radius:10px;font-size:14px;text-decoration:none;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.g{background:var(--ac);color:#fff;border:0;font-weight:600}
.r{color:var(--dg)}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
h2{font-size:14px;margin:18px 0 4px;color:var(--mut)}
.bk{display:flex;gap:8px;margin-top:8px}.bk button{flex:1;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:14px}
#msg{min-height:18px;font-size:13px;margin-top:8px;color:var(--ac)}
.hide{display:none}
.tb{display:flex;gap:8px;margin-top:8px}.seg{display:flex;flex:1;border:1px solid var(--bd);border-radius:10px;overflow:hidden}.seg button{flex:1;padding:9px 4px;border:0;background:var(--card);color:var(--tx);font-size:13px}.seg button.on{background:var(--tx);color:var(--bg)}
select{flex:1;min-width:0;padding:9px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:14px}
.ic{padding:10px 0;min-width:42px;text-align:center}
details.ds{margin-top:4px}details.ds summary{font-size:13px;color:var(--mut);padding:4px 0}details.ds .n{color:var(--tx);font-size:14px;margin-top:2px}
details.add summary{font-weight:600;padding:6px 0}
.card:not(.big){padding:10px}
#near{padding:8px 12px}#near b{font-size:17px}#near .t{font-size:13px}#near span.sm{display:block;font-size:13px;text-decoration:underline;margin-top:2px;cursor:pointer}
</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<style>#map{height:60vh;min-height:320px;border-radius:14px;border:1px solid var(--bd);margin-top:8px}.leaflet-container{font-family:inherit}.pin{width:28px;height:28px;border-radius:50%;background:var(--ac);color:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.5)}.pin.u{background:#dc2626}.pin.l{background:#6b7280;font-size:12px}.pin.g{background:#2563eb;font-size:15px}</style>
</head>
<body>
<div class="gps" id="gps">Шукаю GPS…</div>
<div id="near" class="hide"></div>
<div class="tabs"><button id="t3" class="on">📋 Сьогодні</button><button id="t2">🏠 Клієнти</button><button id="t4">🗺️ Карта</button><button id="t1">🗑️ Баки</button></div>

<div id="p1" class="hide">
  <button id="add">📍 Смітник тут</button>
  <input id="note" placeholder="Нотатка (необов’язково): за рогом, біля арки…">
  <h2 id="cnt"></h2>
  <div id="list"></div>
</div>

<div id="p2" class="hide">
  <input id="addr" placeholder="Адреса клієнта, наприклад: Зелена 48">
  <button id="cadd">📍 Клієнт тут</button>
  <input id="q" placeholder="🔍 Пошук по клієнтах">
  <h2 id="ccnt"></h2>
  <div id="clist"></div>
  <input id="city" placeholder="Місто (лише для клієнтів без мітки), напр.: Київ">
</div>

<div id="p3">
  <details class="add" id="tadd" open><summary>📥 Вставити список замовлень</summary>
  <textarea id="tx" rows="5" placeholder="Встав сюди повідомлення «Список на сьогодні» з бота (можна всі одразу)"></textarea>
  <input id="city3" placeholder="Місто для пошуку адрес, напр.: Львів">
  <div class="acts"><button class="btn g" id="tparse">Розібрати список</button><button class="btn" id="tclear">Очистити</button></div>
  </details>
  <h2 id="tcnt"></h2>
  <div id="tctl"></div>
  <div id="tlink"></div>
  <div id="tlist"></div>
</div>

<div id="p4" class="hide">
  <div class="acts"><button class="btn" id="mme">📍 Я тут</button><button class="btn" id="mall">🔍 Усе</button><button class="btn" id="medit">✏️ Редагувати</button></div>
  <div id="map"></div>
  <div class="n" id="maplg" style="margin-top:8px"></div>
  <div class="n" id="mapmsg"></div>
</div>

<div id="msg"></div>
<h2 id="bkh">Резервна копія</h2>
<div class="bk"><button id="exp">Скопіювати дані</button><button id="imp">Вставити дані</button></div>
<div class="bk"><button id="fexp">💾 Зберегти файлом</button><button id="fimp">📂 З файлу</button></div>
<input type="file" id="ffile" accept=".json,application/json,text/plain" class="hide">
<textarea id="box" rows="3" class="hide" placeholder="Встав скопійовані дані сюди, потім ще раз «Вставити дані»"></textarea>

<script>
var bins=[],clients=[],city="",pos=null,editId=null;
function $(i){return document.getElementById(i)}
function rd(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function wr(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){msg("Не вдалось зберегти. Скопіюй дані вручну.")}}
function msg(t){$("msg").textContent=t}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function dist(a,b,c,d){var R=6371000,r=Math.PI/180,x=(c-a)*r,y=(d-b)*r,h=Math.sin(x/2)*Math.sin(x/2)+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)*Math.sin(y/2);return 2*R*Math.asin(Math.sqrt(h))}
function fmt(m){return m<1000?Math.round(m)+" м":(m/1000).toFixed(1)+" км"}
function route(lat,lng){return"https://www.google.com/maps/dir/?api=1&destination="+lat+","+lng}
function load(){bins=rd("bins_v1",[]);clients=rd("clients_v1",[]);city=rd("city_v1",null);if(city===null){city="Львів";wr("city_v1",city)}$("city").value=city;$("city3").value=city}
function tab(n){[1,2,3,4].forEach(function(i){$("p"+i).classList.toggle("hide",n!==i);$("t"+i).classList.toggle("on",n===i)});msg("");if(n===3)renderToday();if(n===2)renderClients();if(n===4&&initMap()){map.invalidateSize();renderMap();if(!mfit){fitAll();mfit=true}}}
$("t1").onclick=function(){tab(1)};$("t2").onclick=function(){tab(2)};$("t4").onclick=function(){tab(4)};$("t3").onclick=function(){tab(3)};

function sorted(){var it=bins.map(function(b){return{b:b,d:pos?dist(pos.lat,pos.lng,b.lat,b.lng):null}});
  if(pos)it.sort(function(x,y){return x.d-y.d});else it.reverse();return it}
function renderBins(){var it=sorted();
  $("cnt").textContent="Збережено: "+bins.length+(pos?" · найближчі зверху":"");
  $("list").innerHTML=it.slice(0,40).map(function(x,i){var b=x.b;
    return'<div class="card'+(i===0&&pos?' near':'')+'"><div class="row"><div class="info"><div class="d">'+(x.d===null?'—':fmt(x.d))+'</div><div class="n">'+esc(b.note||"без нотатки")+'</div></div><a class="btn g" target="_blank" rel="noopener" href="'+route(b.lat,b.lng)+'">Маршрут</a><button class="btn r" data-bdel="'+b.id+'">✕</button></div></div>'}).join("");
  renderNear()}
function cardC(c){
  if(editId===c.id)return'<div class="card near"><input id="e_addr" value="'+esc(c.addr)+'" placeholder="Адреса"><input id="e_phone" type="tel" value="'+esc(c.phone||"")+'" placeholder="Телефон"><textarea id="e_desc" rows="3" placeholder="Опис: побажання, код, поверх…">'+esc(c.desc||"")+'</textarea><div class="acts"><button class="btn g" data-csave="'+c.id+'">Зберегти</button><button class="btn" data-cpin="'+c.id+'">📍 Мітку сюди</button><button class="btn" data-ccancel="1">Скасувати</button></div></div>';
  var has=c.lat!==undefined,dest=has?route(c.lat,c.lng):"https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(c.addr+(city?", "+city:""));
  var tel=telNorm(c.phone),d=(has&&pos)?" · "+fmt(dist(pos.lat,pos.lng,c.lat,c.lng)):"";
  return'<div class="card"><div class="d">'+esc(c.addr)+'</div><div class="n">'+(has?(c.approx?'≈ приблизна мітка':'📍 мітка є'):'без мітки')+d+'</div>'+(c.phone||c.name?'<div class="n">'+(c.name?'👤 '+esc(c.name)+' ':'')+(c.phone?'📞 '+esc(c.phone):'')+'</div>':'')+(c.desc?'<div class="n">'+esc(c.desc)+'</div>':'')+
  '<div class="acts"><a class="btn g" target="_blank" rel="noopener" href="'+dest+'">Маршрут</a>'+(tel?'<a class="btn" href="tel:'+tel+'">Подзвонити</a>':'')+
  '<button class="btn" data-ced="'+c.id+'">Редагувати</button><button class="btn r" data-cdel="'+c.id+'">✕</button></div></div>'}
function renderClients(){var q=$("q").value.trim().toLowerCase();
  var a=clients.filter(function(c){return!q||(c.addr+" "+(c.phone||"")+" "+(c.desc||"")).toLowerCase().indexOf(q)>=0});
  a=a.slice().reverse();
  if(pos)a.sort(function(x,y){var dx=x.lat!==undefined?dist(pos.lat,pos.lng,x.lat,x.lng):1e12,dy=y.lat!==undefined?dist(pos.lat,pos.lng,y.lat,y.lng):1e12;return dx-dy});
  $("ccnt").textContent="Клієнтів: "+clients.length;
  $("clist").innerHTML=a.map(cardC).join("")}
function render(){renderBins();renderClients();renderMap()}

$("list").onclick=function(e){var id=e.target.getAttribute("data-bdel");if(!id)return;
  bins=bins.filter(function(b){return String(b.id)!==id});wr("bins_v1",bins);render()};
function cget(id){return clients.filter(function(c){return String(c.id)===String(id)})[0]}
function readEdit(c){var a=$("e_addr").value.trim();if(!a){msg("Адреса не може бути порожньою");return false}
  c.addr=a;c.phone=$("e_phone").value.trim();c.desc=$("e_desc").value.trim();return true}
$("clist").onclick=function(e){var t=e.target,g=function(n){return t.getAttribute(n)};var c;
  if(g("data-cdel")){if(!confirm("Видалити клієнта?"))return;clients=clients.filter(function(x){return String(x.id)!==g("data-cdel")});wr("clients_v1",clients);render()}
  else if(g("data-ced")){editId=Number(g("data-ced"));renderClients()}
  else if(g("data-ccancel")){editId=null;renderClients()}
  else if(g("data-csave")){c=cget(g("data-csave"));if(c&&readEdit(c)){editId=null;wr("clients_v1",clients);render();msg("✓ Збережено")}}
  else if(g("data-cpin")){c=cget(g("data-cpin"));if(!pos){msg("Ще нема GPS");return}
    if(c&&readEdit(c)){c.lat=pos.lat;c.lng=pos.lng;c.acc=Math.round(pos.acc);editId=null;wr("clients_v1",clients);render();msg("✓ Мітку оновлено")}}};
$("add").onclick=function(){
  if(!pos){msg("Ще нема GPS. Дозволь доступ до геолокації.");return}
  bins.push({id:Date.now(),lat:pos.lat,lng:pos.lng,acc:Math.round(pos.acc),note:$("note").value.trim(),t:new Date().toISOString()});
  $("note").value="";wr("bins_v1",bins);render();msg("✓ Збережено (точність ±"+Math.round(pos.acc)+" м)");if(navigator.vibrate)navigator.vibrate(60)};
$("cadd").onclick=function(){var a=$("addr").value.trim();
  if(!a){msg("Спершу впиши адресу");$("addr").focus();return}
  if(!pos){msg("Ще нема GPS. Дозволь доступ до геолокації.");return}
  clients.push({id:Date.now(),addr:a,phone:"",desc:"",lat:pos.lat,lng:pos.lng,acc:Math.round(pos.acc),t:new Date().toISOString()});
  $("addr").value="";wr("clients_v1",clients);render();msg("✓ Клієнта збережено. Телефон і опис додай через «Редагувати».");if(navigator.vibrate)navigator.vibrate(60)};
$("q").oninput=renderClients;
function setCity(v){city=v.trim();wr("city_v1",city);$("city").value=city;$("city3").value=city;renderClients();renderToday()}
$("city").onchange=function(){setCity(this.value)};$("city3").onchange=function(){setCity(this.value)};

$("exp").onclick=function(){var t=JSON.stringify({v:2,bins:bins,clients:clients,city:city});
  if(navigator.clipboard){navigator.clipboard.writeText(t).then(function(){msg("Скопійовано. Встав у нотатки як резерв.")},function(){showBox(t)})}else showBox(t)};
function showBox(t){var b=$("box");b.classList.remove("hide");b.value=t;b.select();msg("Скопіюй текст вручну")}
$("imp").onclick=function(){var b=$("box");
  if(b.classList.contains("hide")){b.classList.remove("hide");b.value="";return}
  try{var o=JSON.parse(b.value),nb=Array.isArray(o)?o:(o.bins||[]),nc=o.clients||[],h={},k={};
    bins.forEach(function(x){h[x.id]=1});clients.forEach(function(x){k[x.id]=1});
    nb.forEach(function(x){if(x&&x.lat&&x.lng&&!h[x.id])bins.push(x)});
    nc.forEach(function(x){if(x&&x.addr&&!k[x.id])clients.push(x)});
    if(o.city&&!city){city=o.city;$("city").value=city;wr("city_v1",city)}
    wr("bins_v1",bins);wr("clients_v1",clients);render();b.classList.add("hide");msg("Імпортовано")}catch(e){msg("Не схоже на дані")}};

var today={date:"",orders:[]};
function dkey(){var d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
function loadToday(){var t=rd("today_v1",null);today=(t&&t.date===dkey())?t:{date:dkey(),orders:[]}}
function saveToday(){wr("today_v1",today)}
function hm(m){return Math.floor(m/60)+":"+("0"+m%60).slice(-2)}
function nowMin(){var d=new Date();return d.getHours()*60+d.getMinutes()}
function norm(s){return String(s).toLowerCase().replace(/вулиця|вул\.?|проспект|просп\.?|будинок|буд\./g,"").replace(/[^a-zа-яіїєґ0-9]/g,"")}
function extract(line){
  var s=line.replace(/\u00a0/g," "),o={from:null,to:null,phone:""},m,i,a,b;
  m=s.match(/\+?\d[\d\s()\-]{8,}\d/);
  if(m&&m[0].replace(/\D/g,"").length>=9){o.phone=m[0].trim();s=s.replace(m[0]," ")}
  var re=[/(\d{1,2})[:.](\d{2})\s*[-–—]\s*(\d{1,2})[:.](\d{2})/,/з\s*(\d{1,2})(?::(\d{2}))?\s*до\s*(\d{1,2})(?::(\d{2}))?/i,/(?:^|\s)(\d{1,2})()\s*[-–—]\s*(\d{1,2})()(?=[\s,]|$)/];
  for(i=0;i<3;i++){m=s.match(re[i]);if(!m)continue;
    a=+m[1];b=+m[3];if(a>24||b>24)continue;if(i===2&&!(a>=6&&b-a>=2))continue;
    o.from=a*60+(+m[2]||0);o.to=b*60+(+m[4]||0);s=s.replace(m[0]," ");break}
  o.addr=s.replace(/^\s*\d{1,3}[.)]\s+/,"").replace(/^[\s\-–—•*,;:|]+|[\s\-–—•*,;:|]+$/g,"").replace(/\s{2,}/g," ");
  return o}
function parseGeneric(text){
  var blank=/\n\s*\n/.test(text),res=[],cur=null;
  text.split("\n").forEach(function(raw){
    if(!raw.trim()){cur=null;return}
    var e=extract(raw);
    if(cur&&(!e.addr||blank)){
      if(e.addr)cur.desc+=(cur.desc?"\n":"")+e.addr;
      if(e.from!==null&&cur.from===null){cur.from=e.from;cur.to=e.to}
      if(e.phone&&!cur.phone)cur.phone=e.phone;return}
    if(!e.addr)return;
    cur={id:Date.now()+res.length,addr:e.addr,phone:e.phone,desc:"",from:e.from,to:e.to,done:false};res.push(cur)});
  return res}
function telNorm(p){var d=String(p||"").replace(/\D/g,"");if(d.length===12&&d.indexOf("380")===0)return"+"+d;if(d.length===10&&d[0]==="0")return"+38"+d;return(String(p||"").trim()[0]==="+"?"+":"")+d}
function emo(s){return String(s).replace(/[\u{1F300}-\u{1FAFF}\u2600-\u27BF\u23F0\uFE0F\u200D]/gu,"").trim()}
function geoq(a){var q=String(a).replace(/\(.*?\)/g," ").split(/[,\s]\s*(?:кв\.?|квартира|під['’ʼ]?їзд|поверх|секція|код)(?![а-яіїєґ'’])/i)[0].replace(/^[\s\-–—•*,]+|[\s,.]+$/g,"").replace(/\s{2,}/g," ");var m=q.match(/^(.*?\d+[а-яіїєґa-z]?)\s+\d+$/i);return m?m[1]:q}
function findClient(q){var n=norm(geoq(q||""));if(n.length<4)return null;return clients.filter(function(c){return norm(geoq(c.addr))===n})[0]||null}
var openDesc={};
function descHtml(o){if(!o.desc)return"";return'<details class="ds" data-did="'+o.id+'"'+(openDesc[o.id]?" open":"")+'><summary>Опис</summary><div class="n">'+esc(o.desc)+'</div></details>'}
function mergeDesc(o,c){var have={};have[norm(o.addr)]=1;have[norm(o.q||"")]=1;(o.desc||"").split("\n").forEach(function(l){have[norm(l)]=1});
  var add=[];(c.desc||"").split("\n").forEach(function(l){var k=norm(l);if(k&&!have[k]){have[k]=1;add.push(l.trim())}});
  if(add.length)o.desc=((o.desc||"")+"\n"+add.join("\n")).trim()}
function cleanDesc(addr,t){var seen={};seen[norm(addr||"")]=1;seen[norm(geoq(addr||""))]=1;return String(t||"").split("\n").map(function(l){return l.trim()}).filter(function(l){var k=norm(l);if(!k||seen[k])return false;seen[k]=1;return true}).join("\n")}

  if(lastAv.length){var Lx=lastAv.filter(function(x){return!x.o.done&&today.orders.indexOf(x.o)>=0}),k;for(k=0;k<Lx.length;k++){if(Lx[k].o.lat===undefined||atR(Lx[k]))continue;return Lx[k].o}return null}
  var act=today.orders.filter(function(o){return!o.done}).map(function(o){return{o:o,i:tinfo(o),d:(pos&&o.lat!==undefined)?dist(pos.lat,pos.lng,o.lat,o.lng):null}}).filter(function(x){return x.i.r<2});
  var av=chain(act),i;
  for(i=0;i<av.length;i++){if(av[i].o.lat===undefined||atR(av[i]))continue;return av[i].o}
  return null}
function renderNear(){var n=$("near");
  if(!pos||!bins.length){n.classList.add("hide");wayIds=[];chosenBin=null;return}
  var t=nextTarget(),rows=bins.map(function(b){var d1=dist(pos.lat,pos.lng,b.lat,b.lng);return{b:b,d:d1,c:t?d1+dist(b.lat,b.lng,t.lat,t.lng):d1}}),
    near=rows.slice().sort(function(a,b){return a.d-b.d})[0],
    way=t?rows.slice().sort(function(a,b){return a.c-b.c}).slice(0,3):[near],base=t?dist(pos.lat,pos.lng,t.lat,t.lng):0,html;
  chosenBin=way[0].b;wayIds=way.map(function(r){return r.b.id});
  function det(r){return Math.max(0,r.c-base)}
  function lnk(r,pre){return'<a class="sm" target="_blank" rel="noopener" href="'+route(r.b.lat,r.b.lng)+'">'+pre+fmt(r.d)+(t?' · крюк +'+fmt(det(r)):'')+(r.b.note?' · '+esc(r.b.note):'')+'</a>'}
  if(t){html='<div class="t">'+(today.go&&t.id===today.go?'🎯 ':'')+'Бак по дорозі до: '+esc(t.addr)+'<b>'+fmt(way[0].d)+' · крюк +'+fmt(det(way[0]))+(way[0].b.note?' · '+esc(way[0].b.note):'')+'</b>'+
    ((way.length>1||way.indexOf(near)<0)?'<span class="sm" data-nopen="1">'+(nearOpen?'сховати варіанти':'ще варіанти')+'</span>':'')+(nearOpen?way.slice(1).map(function(r){return lnk(r,'ще: ')}).join("")+(way.indexOf(near)<0?lnk(near,'найближчий: '):''):'')+'</div>'}
  
else html='<div class="t">Найближчий смітник<b>'+fmt(near.d)+(near.b.note?' · '+esc(near.b.note):'')+'</b></div>';
  n.innerHTML=html+'<a target="_blank" rel="noopener" href="'+route(way[0].b.lat,way[0].b.lng)+'">Поїхати</a>';n.classList.remove("hide")}
$("near").onclick=function(e){if(e.target.getAttribute&&e.target.getAttribute("data-nopen")){nearOpen=!nearOpen;renderNear()}};
var map=null,mlayer=null,mme=null,mfit=false,popOpen=false,mEdit=false,mapAv=[],mapLater=[],chosenBin=null,wayIds=[];
function savePin(o,lat,lng,acc){o.lat=lat;o.lng=lng;o.approx=0;
  var a=o.q||o.addr,c=findClient(a);
  if(c){c.lat=lat;c.lng=lng;c.approx=0;c.acc=acc;if(o.phone&&!c.phone)c.phone=o.phone}
  else clients.push({id:Date.now(),addr:a,name:o.name||"",phone:o.phone||"",desc:o.desc||"",lat:lat,lng:lng,acc:acc,t:new Date().toISOString()});
  wr("clients_v1",clients);saveToday()}
function mm(t){$("mapmsg").textContent=t}
function initMap(){if(map)return true;
  if(typeof L==="undefined"){mm("Карта не завантажилась. Потрібен інтернет.");return false}
  map=L.map("map").setView([pos?pos.lat:49.8397,pos?pos.lng:24.0297],14);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
  mlayer=L.layerGroup().addTo(map);mme=L.layerGroup().addTo(map);
  map.on("popupopen",function(){popOpen=true});map.on("popupclose",function(){popOpen=false});
  map.on("click",function(e){if(!mEdit)return;
    var d=document.createElement("div"),b=document.createElement("button");d.innerHTML="<b>Додати смітник тут?</b><br>";
    b.textContent="➕ Додати";b.className="btn g";b.style.marginTop="6px";
    b.onclick=function(){bins.push({id:Date.now(),lat:e.latlng.lat,lng:e.latlng.lng,acc:0,note:"",t:new Date().toISOString()});wr("bins_v1",bins);map.closePopup();popOpen=false;render();renderToday();mm("✓ Смітник додано")};
    d.appendChild(b);L.popup().setLatLng(e.latlng).setContent(d).openOn(map)});
  return true}
function pinIcon(t,c){return L.divIcon({className:"",html:'<div class="pin '+c+'">'+t+'</div>',iconSize:[28,28],iconAnchor:[14,14]})}
function mpop(x){var o=x.o;return'<b>'+esc(o.addr)+'</b><br>'+(x.i.t?esc(x.i.t)+'<br>':'')+(o.name?'👤 '+esc(o.name)+' ':'')+(o.phone?'📞 '+esc(o.phone):'')+(o.desc?'<br>'+esc(o.desc.slice(0,160)).replace(/\n/g,'<br>'):'')+'<br><a href="#" onclick="setGo('+o.id+');return false">'+(o.id===today.go?'↩ Скасувати вибір':'🎯 Їду сюди')+'</a> · <a target="_blank" rel="noopener" href="'+(o.lat!==undefined?route(o.lat,o.lng):'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(ostr(o)))+'">Маршрут</a>'}
function binPop(b){var d=document.createElement("div");
  d.innerHTML='🗑️ '+esc(b.note||"смітник")+'<br><a target="_blank" rel="noopener" href="'+route(b.lat,b.lng)+'">Маршрут</a>';
  if(mEdit){var x=document.createElement("button");x.className="btn r";x.textContent="✕ Видалити";x.style.marginTop="6px";
    x.onclick=function(){bins=bins.filter(function(y){return y.id!==b.id});wr("bins_v1",bins);map.closePopup();popOpen=false;render();renderToday();mm("Смітник видалено")};
    d.appendChild(document.createElement("br"));d.appendChild(x)}
  return d}
function mapPts(){var p=[];if(pos)p.push([pos.lat,pos.lng]);
  mapAv.concat(mapLater).forEach(function(x){if(x.o.lat!==undefined)p.push([x.o.lat,x.o.lng])});
  if(p.length<2)bins.forEach(function(b){p.push([b.lat,b.lng])});return p}
function fitAll(){var p=mapPts();if(!map||!p.length)return;
  if(p.length===1)map.setView(p[0],16);else map.fitBounds(p,{padding:[30,30],maxZoom:16})}
function ordMarker(x,icon,z){var o=x.o,m=L.marker([o.lat,o.lng],{icon:icon,draggable:mEdit,zIndexOffset:z});
  m.bindPopup(mpop(x));
  m.on("dragstart",function(){popOpen=true});
  m.on("dragend",function(e){var ll=e.target.getLatLng();popOpen=false;savePin(o,ll.lat,ll.lng,0);mm("✓ Точку «"+o.addr+"» виправлено і запам’ятав");renderToday()});
  m.addTo(mlayer)}
function renderMap(){if(!map||$("p4").classList.contains("hide"))return;
  mme.clearLayers();
  if(pos){L.circle([pos.lat,pos.lng],{radius:Math.max(pos.acc,5),color:"#2563eb",weight:1,fillOpacity:.1,interactive:false}).addTo(mme);
    L.circleMarker([pos.lat,pos.lng],{radius:8,color:"#fff",weight:3,fillColor:"#2563eb",fillOpacity:1,interactive:false}).addTo(mme)}
  if(popOpen)return;
  mlayer.clearLayers();var nc=0;
  var gt=today.go?today.orders.filter(function(o){return o.id===today.go&&!o.done&&o.lat!==undefined})[0]:null;
  if(gt&&pos)L.polyline([[pos.lat,pos.lng],[gt.lat,gt.lng]],{color:"#2563eb",weight:3,dashArray:"6 8",interactive:false}).addTo(mlayer);
  bins.forEach(function(b){var ch=chosenBin&&b.id===chosenBin.id;
    L.circleMarker([b.lat,b.lng],{radius:ch?9:(wayIds.indexOf(b.id)>=0?7:5),color:(ch||wayIds.indexOf(b.id)>=0)?"#fff":"#92400e",weight:(ch||wayIds.indexOf(b.id)>=0)?3:1,fillColor:ch?"#f97316":(wayIds.indexOf(b.id)>=0?"#fb923c":"#f59e0b"),fillOpacity:1,bubblingMouseEvents:false})
      .bindPopup(binPop(b)).addTo(mlayer)});
  mapLater.forEach(function(x){if(x.o.lat===undefined){nc++;return}ordMarker(x,pinIcon(Math.floor(x.o.from/60),"l"),0)});
  mapAv.forEach(function(x,k){if(x.o.lat===undefined){nc++;return}ordMarker(x,(x.o.id===today.go?pinIcon("🎯","g"):pinIcon(k+1,x.i.r===0?"u":"")),500)});
  $("maplg").textContent="🟢 замовлення (номер = порядок) · 🔴 терміново · ⚪ пізніше (година початку) · 🟠 смітники"+(nc?" · без координат: "+nc:"")}
$("mme").onclick=function(){if(map&&pos)map.setView([pos.lat,pos.lng],17);else mm("Ще нема GPS")};
$("mall").onclick=fitAll;
$("medit").onclick=function(){mEdit=!mEdit;this.textContent=mEdit?"✏️ Редагування: УВІМК":"✏️ Редагувати";this.classList.toggle("g",mEdit);
  popOpen=false;if(map)map.closePopup();renderMap();
  mm(mEdit?"Тягни позначку замовлення, щоб виправити точку. Тапни на порожнє місце, щоб додати смітник. Тапни на смітник, щоб видалити.":"")};
function importText(txt){try{var o=JSON.parse(txt),nb=Array.isArray(o)?o:(o.bins||[]),nc=o.clients||[],h={},k={},ab=0,ac=0;
    bins.forEach(function(x){h[x.id]=1});clients.forEach(function(x){k[x.id]=1});
    nb.forEach(function(x){if(x&&x.lat&&x.lng&&!h[x.id]){bins.push(x);ab++}});
    nc.forEach(function(x){if(x&&x.addr&&!k[x.id]){clients.push(x);ac++}});
    if(o.city&&!city)setCity(o.city);
    wr("bins_v1",bins);wr("clients_v1",clients);render();renderToday();msg("Імпортовано: смітників "+ab+", клієнтів "+ac);return true}
  catch(e){msg("Не схоже на дані");return false}}
function bkLabel(){var t=rd("bk_v1",null);$("bkh").textContent="Резервна копія · "+(t?"остання: "+new Date(t).toLocaleDateString("uk-UA"):"ще не робилась")}
$("fexp").onclick=function(){var t=JSON.stringify({v:2,bins:bins,clients:clients,city:city}),name="bins-"+new Date().toISOString().slice(0,10)+".json";
  function mark(){wr("bk_v1",new Date().toISOString());bkLabel()}
  try{var f=new File([t],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:name}).then(function(){mark();msg("✓ Копію збережено")}).catch(function(){});return}}catch(e){}
  var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();a.remove();mark();msg("Файл завантажено")};
$("fimp").onclick=function(){$("ffile").click()};
$("ffile").onchange=function(){var f=this.files&&this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){importText(String(r.result))};r.readAsText(f);this.value=""};
bkLabel();
function watch(){
  if(!navigator.geolocation){$("gps").textContent="Геолокація недоступна";return}
  navigator.geolocation.watchPosition(function(p){pos={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy};
    $("gps").textContent="GPS: ±"+Math.round(pos.acc)+" м";renderBins();if(editId===null)renderClients();if(Date.now()-lastRT>3000)renderToday()},
  function(){$("gps").textContent="GPS не дозволено. Увімкни геолокацію для браузера."},
  {enableHighAccuracy:true,maximumAge:3000,timeout:20000})}
load();loadToday();tidy();$("tadd").open=!today.orders.length;render();renderToday();watch();
